<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electro Union — Gate</title>

  <!-- Shared base -->
  <link rel="stylesheet" href="../_shared/fonts.css">
  <link rel="stylesheet" href="../_shared/tokens.css">
  <link rel="stylesheet" href="style.css">

  <!-- Shared JS — must load before body so is-embed class is set -->
  <script src="../_shared/embed.js"></script>
  <script src="../_shared/supabase.js"></script>

<body>

<div class="eu" id="eu">

  <!-- Top bar: "☐ I approve this message" button -->
  <div class="eu-bar" id="euBtn">
    <div class="eu-bar__initial" id="euBarInitial">
      <div class="eu-checkbox">
        <div class="eu-checkbox__check">
          <img src="GIFS/4YCZ5UYFPSM2TS36QSYGFSWQDIVKJIWN.gif" alt="EU Flag" class="eu-checkbox__gif">
        </div>
      </div>
      <div class="eu-bar__cta" id="euBarCta">I approve this message</div>
    </div>
    <div class="eu-bar__approved" id="euBarApproved">
      <span class="eu-bar__count" id="euBarCount"></span> approve this message.
    </div>
  </div>


</div><!-- /.eu -->

<script src="script.js"></script>
